# version: "3.9"

services:
  app-dev:
    build: .
    ports:
      - "4001:3000"
    volumes:
      - .:/app:Z
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    command: npm run dev

  app-prod:
    build: .
    ports:
      - "4000:3000"
    environment:
      NODE_ENV: production
    command: npm run start

volumes:
  node_modules: